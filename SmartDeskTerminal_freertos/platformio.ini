; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; SmartDeskTerminal - Phase 1 工程初始化
; 路线：PlatformIO + framework=stm32cube（HAL）；FreeRTOS Phase 3 引入（ADR-001/002 C 路线）
; 板子：LXB407VE-P1（STM32F407VET6，外部晶振 8MHz，用户 LED = PC0）

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

; FreeRTOS 集成配置（Phase 3，ADR-001/002）
; lib_extra_dirs 指向 FreeRTOS-Kernel，build_flags 加 include 路径
; 只编译 GCC/ARM_CM4F 移植层（用 build_src_filter 排除其他移植层的 .c）
lib_extra_dirs =
    lib

build_unflags =
    -mfloat-abi=soft
    -mfloat-abi=softfp
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

build_flags =
    -DHSE_VALUE=8000000U
    -Og
    -Isrc
    -Ilib/FreeRTOS-Kernel/include
    -Ilib/FreeRTOS-Kernel/portable/GCC/ARM_CM4F
    -Ilib/FreeRTOS-Kernel/portable/MemMang
    ; 只编译 ARM_CM4F 移植层，排除其他移植目录
    -DFreeRTOS_portable_GCC_ARM_CM4F

; 编译 FreeRTOS 时排除不需要的移植层（通过 lib_ldf_mode + 源文件过滤）
lib_ldf_mode = chain+

; 发布时的编译选项（使用 -Os 优化体积）
build_type = release

; 调试时的专属编译选项（强制无优化并生成符号，仅用于 Debug）
debug_build_flags =
    -DHSE_VALUE=8000000U
    -g
    -O0