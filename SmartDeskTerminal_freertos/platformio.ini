;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; SmartDeskTerminal - Phase 1 工程初始化
; 路线：PlatformIO + framework=stm32cube（HAL）；FreeRTOS 到 Phase 3 再引入
; 板子：LXB407VE-P1（STM32F407VET6，外部晶振 8MHz，用户 LED = PC0）

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = stm32cube
upload_protocol = stlink
build_flags =
    -DHSE_VALUE=8000000U    ; 必需：PIO 框架默认按 25MHz 外部晶振算，本板是 8MHz
                            ; 不覆盖会导致 HAL_Delay 延时和串口波特率全部偏差 3.125 倍
