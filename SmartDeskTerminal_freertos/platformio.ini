; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; SmartDeskTerminal - Phase 1 工程初始化
; 路线：PlatformIO + framework=stm32cube（HAL）；FreeRTOS 到 Phase 3 再引入
; 板子：LXB407VE-P1（STM32F407VET6，外部晶振 8MHz，用户 LED = PC0）

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

; 发布时的编译选项（使用 -Os 优化体积）
build_flags =
    -DHSE_VALUE=8000000U
    -Og
; 调试时的专属编译选项（强制无优化并生成符号，仅用于 Debug）
debug_build_flags =
    -DHSE_VALUE=8000000U
    -g
    -O0