; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; SmartDeskTerminal - FreeRTOS Phase 3（ADR-012）
; 路线：PlatformIO + framework=stm32cube（HAL）+ FreeRTOS via lib_deps
; 板子：LXB407VE-P1（STM32F407VET6，外部晶振 8MHz，用户 LED = PC0）

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

; FreeRTOS via PIO lib_deps（方案 B，ADR-012）
; linlin-study/FreeRTOS-Kernel 是 PIO 注册表的打包版，带 library.json
; LVGL v8.3（ADR-013）：资料/教程最全的稳定版，PIO registry 官方包
; ⚠️ 用精确版本号 @8.3.11：写 ^8.3.11 会被解析成"任意 8.x"拉到 8.4.0（实测踩过）
lib_deps =
    linlin-study/FreeRTOS-Kernel@10.4.4-1
    lvgl/lvgl@8.3.11

; 注（2026-09-22 实测，勿重复尝试）：曾怀疑 FreeRTOS 包内 596 个文件（含 ARM7/
; IAR/Atmel 等其它平台）被 LDF 全量扫描拖慢构建，加 lib_ldf_mode=off +
; lib_compat_mode=off 实测：11.80s → 11.94s，**无收益**，已回退。
; 结论：`pio run` 那 ~10s 是 PIO/SCons 自身的固有开销（配置加载 + 构建图检查），
; 与 LDF 无关。真正能省时间的做法见 progress.md「构建与烧录」一节。

; FPU 配置：F407 有 FPU，用 ARM_CM4F port（ADR-012）
; build_unflags 移除 board 默认的 softfp，确保链接器也用 hard float
; extra_script.py 强制给链接器传 -mfloat-abi=hard（build_flags 只传给编译器）
extra_scripts = extra_script.py

build_unflags =
    -mfloat-abi=soft
    -mfloat-abi=softfp

build_flags =
    -DHSE_VALUE=8000000U
    -Og
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE
    ; ^ LVGL 配置查找方式：lvgl.h 里 #include "lv_conf.h"（简单路径），
    ;   配合 -Isrc 找到 src/lv_conf.h。不加这个宏 LVGL 会找 ../../lv_conf.h（相对库目录）找不到。
    ; ---- USB CDC（Phase 8）----
    -Ilib/usb_device
    ; ^ USB Device Middleware 复制到 lib/usb_device/，告诉编译器头文件在那
    ;   USE_USB_FS 在 lib/usb_device/usbd_conf.h 里定义，不在这里重复定义
    ; ---- 防内存别名（2026-09-25 加，血的教训）----
    -fno-common
    ; ^ ⚠️ 必须保留！ARM GCC 默认 -fcommon，会把**同名但不同文件**的
    ;   暂定定义（如 `PCD_HandleTypeDef hUsbDeviceFS;` 与
    ;   `USBD_HandleTypeDef hUsbDeviceFS;`）**静默合并成同一块内存**，
    ;   两个结构体互相覆写 → 任意地址读写 → 屏幕花屏/随机崩溃，
    ;   且**编译链接全程零警告**，只能靠读 ELF 符号表才发现。
    ;   -fno-common 让这种情况直接变成链接期 "multiple definition" 错误。
    ;   详见 troubleshooting.md T-007。

; 调试时的专属编译选项（强制无优化并生成符号，仅用于 Debug）
debug_build_flags =
    -DHSE_VALUE=8000000U
    -g
    -O0
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
